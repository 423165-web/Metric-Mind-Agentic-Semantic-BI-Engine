# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models

name: 'metricmind'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'metricmind'

# Directories
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  metricmind:

    staging:
      +schema: STAGING
      +materialized: view

    intermediate:
      +schema: INTERMEDIATE
      +materialized: view

    marts:
      +schema: MARTS
      +materialized: table